[package]
name = "antijanja"
version = "0.3.2"
description = "AntiJanja - compartilhamento de tela P2P"
edition = "2021"
publish = false

[[bin]]
name = "antijanja"
path = "src/main.rs"

[build-dependencies]
slint-build = "1.18"
embed-resource = "3"

[dependencies]
# Interface
# unstable-winit-030: atributos da janela dos controles por cima do vídeo (src/overlay.rs)
slint = { version = "1.18", features = ["raw-window-handle-06", "unstable-winit-030"] }
arboard = { version = "3", default-features = false }
raw-window-handle = "0.6"
# Atualização automática (releases do GitHub, assinadas com minisign)
ureq = "3"
minisign-verify = "0.3"
# Motor (captura, codificação, P2P, áudio, player)
async-trait = "0.1.92"
base64 = "0.23.1"
blake3 = "1.8.7"
# Senha da transmissão: deriva as chaves (lento de propósito contra tentativa e erro)
argon2 = "0.5"
bytes = "1.12.1"
chacha20poly1305 = "0.11.0"
# Mesma versão que o mainline usa (assinatura das respostas do host e do mural)
ed25519-dalek = { version = "3", default-features = false }
# Conta (docs/amizades.md): frase de recuperação de 24 palavras e a chave que cifra
# as mensagens entre amigos (Diffie-Hellman)
bip39 = { version = "2", features = ["portuguese"] }
x25519-dalek = { version = "3", features = ["static_secrets"] }
# Pedaços codificados da malha (docs/malha-p2p.md): qualquer k pedaços refazem o quadro
raptorq = "2"
flate2 = "1.1.11"
futures = "0.3.34"
getrandom = "0.4.3"
image = "0.25.10"
mainline = "8.0.1"
opus = "0.4.0"
pollster = "1.0.1"
rtc = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Fofoca entre os apps (docs/gossip-ao-vivo.md): socket de multicast da rede local
socket2 = "0.6"
sysinfo = "0.40.3"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "sync", "macros"] }
wasapi = "0.27.0"
webrtc = "0.21.1"
wgpu = "30.0.2"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D10", "Win32_Media", "Win32_Graphics_Dwm", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_DataExchange"] }
windows-capture = "2.0.1"
xcap = "0.9.10"
igd-next = "0.18.0"
turn = "0.17"
webrtc-util = { version = "0.17.3", default-features = false }

# LTO "thin" e algumas unidades de código: binário quase igual, build bem mais leve
# (o build completo com lto=true travava o PC).
# Argon2 sem otimização (build de desenvolvimento) leva segundos por senha.
# Versão de desenvolvimento: as bibliotecas (Slint, wgpu, webrtc...) otimizadas, o código
# do app não (compila rápido e dá para depurar). Sem isso a interface ficava bem mais lenta
# que a release: cada ícone SVG era desenhado com código sem otimização na primeira vez
# que aparecia.
[profile.dev.package."*"]
opt-level = 2
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
codegen-units = 4
lto = "thin"
opt-level = "s"
strip = true
